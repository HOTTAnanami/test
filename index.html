<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio - Interactive Hero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. メインビジュアルエリア（なぞり・浮遊エリア） -->
    <section id="hero-area" class="hero-section">
        <div class="lead-text">Drag here</div>
        <div id="trail-container"></div>
        
        <!-- 自動スクロールボタン -->
        <button id="scroll-btn" class="scroll-btn" aria-label="Scroll Down">
            <span>SCROLL DOWN</span>
            <div class="arrow"></div>
        </button>
    </section>

    <!-- 2. メッセージセクション（スクロール後に背景が#FCF36Aへ変化） -->
    <section class="message-section">
        <div class="message-inner">
            <span class="sub-title">OUR PHILOSOPHY</span>
            <h2 class="main-title">形なき想いに、<br>情緒と色彩を。</h2>
            <p class="description">
                私たちは、視覚表現の可能性を追求するデザインスタジオです。<br>
                グラフィック、Web、プロダクトの垣根を越え、記憶に残り続けるノイズのない美しい体験を創造します。<br>
                変化し続ける時代の中で、変わらない美しさと確かな想いを社会へ届けていきます。
            </p>
            <div class="company-info">
                <p><strong>AURA DESIGN INC.</strong></p>
                <p>Tokyo / Kyoto / Online</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
