<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Trail Image Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. マウス/指の追従エリア -->
    <section id="hero-area" class="hero-section">
        <div class="lead-text">Cursor or Drag around here</div>
        <!-- 画像が出現するコンテナ -->
        <div id="trail-container"></div>
        <div class="scroll-hint">SCROLL DOWN</div>
    </section>

    <!-- 2. 下にスクロールすると登場するメッセージエリア -->
    <section class="message-section">
        <div class="message-inner">
            <span class="sub-title">OUR PHILOSOPHY</span>
            <h2 class="main-title">形なき想いに、<br>情緒と色彩を。</h2>
            <p class="description">
                私たちは、視覚表現の可能性を追求するデザインスタジオです。<br>
                グラフィック、Web、プロダクトの垣根を越え、記憶に残り続けるノイズのない美しい体験を創造します。<br>
                変化し続ける時代の中で、変わらない美しさと確かな想いを社会へ届けていきます。
            </p>
            <div class="company-info">
                <p><strong>AURA DESIGN INC.</strong></p>
                <p>Tokyo / Kyoto / Online</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
